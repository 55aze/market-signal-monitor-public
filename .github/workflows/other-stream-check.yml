name: Other stream health verification
on:
  push:
    branches: [fix/freshness-attempt-consistency]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-tv.txt
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Read public provider timestamps and session metadata
        if: always()
        run: |
          mkdir -p public-session-audit
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from tvDatafeed import TvDatafeed, Interval
          from market_signal_monitor.scanner import fetch_worker
          from market_signal_monitor.confirmation import policy_for, confirmation_times
          from market_signal_monitor.freshness import assess_freshness
          root = Path('public-session-audit')
          cfg = json.loads(Path('config/universe.example.json').read_text())
          instruments = {x['id']: x for x in cfg['instruments']}
          result = []
          for name in ('VIX','BRENT','DXY','LITE','SPCX','JPYUSD'):
              i = instruments[name]
              tfs = ('30m','4H','1D','1W') if name in ('VIX','BRENT') else ('30m',)
              for tf in tfs:
                  record = {'stream': name+':'+tf, 'source': i['exchange']+':'+i['symbol']}
                  try:
                      bars = fetch_worker(i, tf, 2200, timeout=30, attempts=2)
                      index = bars.index
                      (root/(name+'-'+tf+'-timestamps.json')).write_text(json.dumps([x.isoformat() for x in index]))
                      now = pd.Timestamp.now(tz='UTC')
                      record.update({'fetched_at':now.isoformat(),'bars':len(index),'first':index[0].isoformat(),'last':index[-1].isoformat(),'policy':policy_for(i)})
                      try:
                          closes = confirmation_times(bars, i, tf, strict_since=pd.Timestamp('2026-10-19T00:00:00Z'))
                          latest = max((s for s,c in zip(index,closes) if pd.notna(c) and c<=now), default=None)
                          record['confirmation'] = 'passed'
                          if latest is not None:
                              prior = pd.Timestamp('2026-10-23T20:30:00Z') if name in ('DXY','JPYUSD') else latest
                              record['freshness'] = assess_freshness(index,i,tf,now,latest,previous_through=prior,enabled=policy_for(i) is not None)
                      except Exception as e:
                          record['confirmation_error'] = str(e)
                      if tf == '30m':
                          tv = TvDatafeed()
                          messages = []
                          original = tv._TvDatafeed__create_df
                          def capture(raw, symbol):
                              messages.append(raw)
                              return original(raw, symbol)
                          tv._TvDatafeed__create_df = capture
                          tv.get_hist(symbol=i['symbol'],exchange=i['exchange'],interval=Interval.in_30_minute,n_bars=10,extended_session=False)
                          for raw in messages:
                              for piece in raw.split('~m~'):
                                  try:
                                      message = json.loads(piece)
                                      if message.get('m') == 'symbol_resolved':
                                          data = message['p'][-1]
                                          record['metadata'] = {k:data[k] for k in ('name','exchange','timezone','session','session_holidays','subsessions') if k in data}
                                  except (ValueError,TypeError,AttributeError,KeyError):
                                      continue
                  except Exception as e:
                      record['fetch_error'] = str(e)
                  result.append(record)
                  print(json.dumps(record), flush=True)
          (root/'summary.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: other-stream-session-evidence
          path: public-session-audit/
          retention-days: 7
