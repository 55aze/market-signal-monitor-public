name: Recovery deployment probe
on:
  push:
    branches: [fix/pipeline-integrity-20261110]
    paths: [.github/workflows/recovery-deploy-probe.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke the existing live workflow without changing its schedule
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(base+'/git/ref/heads/main',headers=headers),timeout=30) as r:
              actual=json.load(r)['object']['sha']
          if actual!='55e3b19110986ced44bbfe1f5829da04fc7c3c5f':
              raise RuntimeError('Production head changed; inspect before dispatch')
          body={'ref':'main','inputs':{'mode':'live','trigger_source':'manual','scheduled_for':'','instruments':''}}
          req=urllib.request.Request(base+'/actions/workflows/scan.yml/dispatches',data=json.dumps(body).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print('DISPATCH_STATUS',r.status,'HEAD',actual)
          PY
