name: Market signal scan
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
permissions:
  contents: read
concurrency:
  group: market-signal-notion-writer
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SCAN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . -r requirements-tv.txt
      - run: python -m unittest discover -s tests -v
      - name: Load private runtime configuration
        env:
          MONITOR_CONFIG_JSON: ${{ secrets.MONITOR_CONFIG_JSON }}
        run: |
          python -c 'import os,json,pathlib; value=json.loads(os.environ["MONITOR_CONFIG_JSON"]); p=pathlib.Path("config/universe.json"); p.write_text(json.dumps(value)); p.chmod(0o600)'
      - name: Scan without exposing private reports to public logs
        run: |
          mkdir -p reports
          args=(--mode "$SCAN_MODE")
          if [[ "$SCAN_MODE" == "dry-run" ]]; then
            args+=(--instruments QQQ)
          fi
          python -m market_signal_monitor.scanner "${args[@]}" > reports/runtime.log 2>&1
      - name: Public-safe run summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('reports/scan.json')
          if p.exists():
              r = json.loads(p.read_text())
              print(json.dumps({k: r[k] for k in ('status', 'duration_seconds', 'delivery_seconds', 'created', 'existing') if k in r}))
              print('errors:', len(r.get('errors', [])), 'warnings:', len(r.get('warnings', [])))
          PY
