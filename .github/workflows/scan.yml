name: Market signal scan
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
      trigger_source:
        type: choice
        options: [manual, external]
        default: manual
      scheduled_for:
        type: string
        default: ''
      instruments:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: market-signal-notion-writer
  cancel-in-progress: false
jobs:
  scan:
    if: vars.MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SCAN_MODE: ${{ inputs.mode }}
      TRIGGER_SOURCE: ${{ inputs.trigger_source }}
      SCHEDULED_FOR: ${{ inputs.scheduled_for }}
      SCAN_INSTRUMENTS: ${{ inputs.instruments }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . -r requirements-tv.txt
      - run: python -m unittest discover -s tests -v
        if: inputs.trigger_source != 'external'
      - name: Validate external trigger
        run: |
          python scripts/validate_trigger.py --event-name workflow_dispatch --mode "$SCAN_MODE" --trigger-source "$TRIGGER_SOURCE" --scheduled-for "$SCHEDULED_FOR" --instruments "$SCAN_INSTRUMENTS"
      - name: Load private runtime configuration
        env:
          MONITOR_CONFIG_JSON: ${{ secrets.MONITOR_CONFIG_JSON }}
          STATE_ENGINE_CONFIG_JSON: ${{ secrets.STATE_ENGINE_CONFIG_JSON }}
          TICKER_ENGINE_ENABLED: ${{ vars.TICKER_ENGINE_ENABLED }}
        run: |
          python - <<'PY'
          import os, json, pathlib
          value = json.loads(os.environ["MONITOR_CONFIG_JSON"])
          # Explicit additive rollout: preserve private settings and existing instruments.
          public = json.loads(pathlib.Path("config/universe.example.json").read_text())
          existing = {item["id"] for item in value["instruments"]}
          for item in public["instruments"]:
              if item["id"] in {"AMZN", "NOW"} and item["id"] not in existing:
                  value["instruments"].append(item)
                  existing.add(item["id"])
          engine = os.environ.get("STATE_ENGINE_CONFIG_JSON")
          if engine:
              overlay = json.loads(engine)
              for key in ("ticker_engine", "theme_membership", "exposure_groups"):
                  if key in overlay:
                      value[key] = overlay[key]
              value["ticker_engine"]["enabled"] = os.environ.get("TICKER_ENGINE_ENABLED") == "true"
          p = pathlib.Path("config/universe.json")
          p.write_text(json.dumps(value))
          p.chmod(0o600)
          PY
      - name: Verify ticker engine access
        if: inputs.trigger_source == 'manual'
        run: python scripts/verify_engine_access.py
      - name: Ensure AMZN status rows
        if: inputs.mode == 'live'
        run: python scripts/enroll_amzn.py
      - name: Scan without exposing private reports to public logs
        run: |
          mkdir -p reports
          args=(--mode "$SCAN_MODE")
          if [[ "$SCAN_MODE" == "dry-run" ]]; then
            args+=(--instruments QQQ)
          fi
          python -m market_signal_monitor.scanner "${args[@]}" > reports/runtime.log 2>&1
      - name: Public-safe run summary
        if: always()
        run: python scripts/verify_live_run.py
