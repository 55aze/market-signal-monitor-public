name: Reporter delivery regression
on:
  pull_request:
    paths:
      - 'scripts/reporter_delivery.py'
      - 'tests/test_reporter_delivery.py'
      - 'docs/trading-signal-watch-delivery-v3.md'
      - '.github/workflows/reporter-delivery-tests.yml'
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test cold-start delivery and receipt safety without network or secrets
        run: python -m unittest discover -s tests -p 'test_reporter_delivery.py' -v
